name: Build and Release Android App

on:
  # Push to main triggers a compile-only build (cargo + debug APK) that does NOT
  # require signing secrets. A successful push build proves the Rust JNI bridge
  # and the Android app compile.
  push:
    branches: [ "main" ]
  # Manual dispatch produces a signed, tagged release APK (needs repo secrets).
  workflow_dispatch:
    inputs:
      app_version_name:
        description: 'Version Name'
        required: true
        default: '2.0.X'
        type: string
      app_version_code:
        description: 'Version Code (0 = auto-increment)'
        required: false
        default: '10000'
        type: string
      note:
        description: 'Update Note'
        required: false
        default: ''
        type: string
      prerelease:
        description: '发布预览版'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore and Setup Properties
        # Only needed for a signed release; skipped on push builds.
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "MY_KEYSTORE_FILE=upload_keystore.jks" > keystore.properties
          echo "MY_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "MY_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "MY_KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> keystore.properties

          mkdir -p Scrcpy/app
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > Scrcpy/app/upload_keystore.jks

      - name: Update Android Version
        # Bumping versionCode on every push would pollute history; only on dispatch.
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          INPUT_CODE="${{ inputs.app_version_code }}"
          if [ "$INPUT_CODE" = "0" ] || [ -z "$INPUT_CODE" ]; then
            CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' Scrcpy/app/build.gradle | head -1)
            NEW_CODE=$((CURRENT_CODE + 1))
          else
            NEW_CODE="$INPUT_CODE"
          fi

          sed -i "s/versionCode [0-9]\+/versionCode ${NEW_CODE}/" Scrcpy/app/build.gradle
          sed -i 's/versionName ".*"/versionName "${{ inputs.app_version_name }}"/' Scrcpy/app/build.gradle

          echo "new_version_code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "New versionCode=${NEW_CODE}"
          echo "New versionName=${{ inputs.app_version_name }}"

      - name: Install Rust (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build EasyTier native library (arm64-v8a)
        env:
          NDK_PATH: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang pkg-config
          # Ensure the Android std is present for whatever toolchain cargo resolves.
          rustup target add aarch64-linux-android
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$CLANG"
          EOF
          cd Scrcpy/easytier-lib
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target aarch64-linux-android
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libeasytier_android.so ../app/src/main/jniLibs/arm64-v8a/
          ls -l ../app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x Scrcpy/gradlew

      - name: Build Server
        run: |
          cd Scrcpy
          ./gradlew :server:copyRelease --no-daemon

      - name: Build App
        run: |
          cd Scrcpy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Signed release APK (requires the keystore secrets above).
            ./gradlew :app:assembleRelease --no-daemon
          else
            # Push builds: compile a debug APK to verify the whole tree builds
            # without needing any signing secrets.
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Rename APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release
          APK_PATH=$(find Scrcpy/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" release/Scrcpy.apk
          ls -l release

      - name: Generate Tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Scrcpy Release ${{ steps.tag.outputs.release_tag }}
          body: |
            Version Name: ${{ inputs.app_version_name }}
            Version Code: ${{ steps.version.outputs.new_version_code }}
            Build Date: ${{ steps.tag.outputs.release_date }}
            Note: ${{ inputs.note }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release/Scrcpy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
