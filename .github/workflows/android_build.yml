name: Build and Release Android App

on:
  # Push to main triggers a compile-only build (cargo + debug APK) that does NOT
  # require signing secrets. A successful push build proves the Rust JNI bridge
  # and the Android app compile.
  push:
    branches: [ "main" ]
  # Manual dispatch produces a signed, tagged release APK (needs repo secrets).
  workflow_dispatch:
    inputs:
      app_version_name:
        description: 'Version Name'
        required: true
        default: '2.0.X'
        type: string
      app_version_code:
        description: 'Version Code (0 = auto-increment)'
        required: false
        default: '10000'
        type: string
      note:
        description: 'Update Note'
        required: false
        default: ''
        type: string
      prerelease:
        description: '发布预览版'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore and Setup Properties
        # Only needed for a signed release; skipped on push builds.
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "MY_KEYSTORE_FILE=upload_keystore.jks" > keystore.properties
          echo "MY_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "MY_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "MY_KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> keystore.properties

          mkdir -p Scrcpy/app
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > Scrcpy/app/upload_keystore.jks

      - name: Update Android Version
        # Bumping versionCode on every push would pollute history; only on dispatch.
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          INPUT_CODE="${{ inputs.app_version_code }}"
          if [ "$INPUT_CODE" = "0" ] || [ -z "$INPUT_CODE" ]; then
            CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' Scrcpy/app/build.gradle | head -1)
            NEW_CODE=$((CURRENT_CODE + 1))
          else
            NEW_CODE="$INPUT_CODE"
          fi

          sed -i "s/versionCode [0-9]\+/versionCode ${NEW_CODE}/" Scrcpy/app/build.gradle
          sed -i 's/versionName ".*"/versionName "${{ inputs.app_version_name }}"/' Scrcpy/app/build.gradle

          echo "new_version_code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "New versionCode=${NEW_CODE}"
          echo "New versionName=${{ inputs.app_version_name }}"

      - name: Install Rust (with Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build EasyTier native library (arm64-v8a)
        env:
          NDK_PATH: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          # NOTE: GitHub's default `run:` shell is `bash -e -o pipefail`, so any
          # non-zero command aborts the whole step. That is almost certainly why the
          # previous runs stopped right after `rustup target add` (which can return
          # non-zero when the target is already present) and never reached `cargo
          # build`. We disable -e here so every command runs and the FULL trace is
          # captured into the log regardless of intermediate failures.
          set +e
          LOG="${{ github.workspace }}/easytier_build.log"
          : > "$LOG"
          {
            set -x
            echo "BUILD STEP START PWD=$(pwd) WS=$GITHUB_WORKSPACE GHWS=${{ github.workspace }}"
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler clang pkg-config
            rustup target add aarch64-linux-android; echo "rustup target add rc=$?"

            # Resolve NDK path robustly. The setup-ndk action's output name can vary,
            # and env propagation into `run:` is not guaranteed, so probe several vars.
            NDK_PATH="${NDK_PATH:-$ANDROID_NDK_ROOT}"
            NDK_PATH="${NDK_PATH:-$ANDROID_NDK_HOME}"
            if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_HOME" ]; then
              NDK_PATH=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)
            fi
            echo "NDK_PATH=[$NDK_PATH]"
            [ -n "$NDK_PATH" ] || echo "WARNING: NDK_PATH empty; linker path will be wrong"

            TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
            CLANG="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
            echo "TOOLCHAIN=[$TOOLCHAIN] CLANG=[$CLANG]"
            ls -l "$CLANG" 2>&1 || echo "CLANG binary missing"
            mkdir -p ~/.cargo
            printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$CLANG" > ~/.cargo/config.toml
            echo "--- ~/.cargo/config.toml ---"
            cat ~/.cargo/config.toml

            # A cdylib (.so) MUST link the C runtime dynamically. The +crt-static flag
            # (used for static binaries, see easytier-android-build) makes cargo reject
            # a cdylib with "does not support these crate types", so force -crt-static.
            # Point the NDK C/C++ toolchain at the right clang/ar/sysroot so any C deps
            # pulled in by easytier-core (openssl-sys, libsqlite3-sys, protobuf, ...) resolve.
            export SYSROOT="$TOOLCHAIN/sysroot"
            export ANDROID_NDK_HOME="$NDK_PATH"
            export PROTOC=/usr/bin/protoc
            export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
            export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android21-clang++"
            export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
            export CC_aarch64-linux-android="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
            export CXX_aarch64-linux-android="$TOOLCHAIN/bin/aarch64-linux-android21-clang++"
            export AR_aarch64-linux-android="$TOOLCHAIN/bin/llvm-ar"
            export CFLAGS_aarch64_linux_android="--sysroot=$SYSROOT"
            export CXXFLAGS_aarch64_linux_android="--sysroot=$SYSROOT"
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$SYSROOT"
            export CFLAGS_aarch64-linux-android="--sysroot=$SYSROOT"
            export CXXFLAGS_aarch64-linux-android="--sysroot=$SYSROOT"
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android="--sysroot=$SYSROOT"
            export TARGET_CC="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
            export TARGET_CFLAGS="--sysroot=$SYSROOT"
            echo "ENV SET, running cargo build"
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --manifest-path Scrcpy/easytier-lib/Cargo.toml --release --target aarch64-linux-android
            BUILD_RC=$?
            echo "cargo build exit code: $BUILD_RC"
            if [ -f Scrcpy/easytier-lib/target/aarch64-linux-android/release/libeasytier_android.so ]; then
              mkdir -p Scrcpy/app/src/main/jniLibs/arm64-v8a
              cp Scrcpy/easytier-lib/target/aarch64-linux-android/release/libeasytier_android.so Scrcpy/app/src/main/jniLibs/arm64-v8a/
              ls -l Scrcpy/app/src/main/jniLibs/arm64-v8a/
            else
              echo "Build did not produce libeasytier_android.so"
            fi
            exit $BUILD_RC
          } >> "$LOG" 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x Scrcpy/gradlew

      - name: Build Server
        run: |
          cd Scrcpy
          ./gradlew :server:copyRelease --no-daemon > /tmp/gradle_server.log 2>&1

      - name: Build App
        run: |
          cd Scrcpy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Signed release APK (requires the keystore secrets above).
            ./gradlew :app:assembleRelease --no-daemon > /tmp/gradle_app.log 2>&1
          else
            # Push builds: compile a debug APK to verify the whole tree builds
            # without needing any signing secrets.
            ./gradlew :app:assembleDebug --no-daemon > /tmp/gradle_app.log 2>&1
          fi

      - name: Upload APK artifact
        # Make the compiled APK downloadable from the Actions run page even on
        # push builds (which don't produce a signed release).
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Scrcpy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Surface build log (native + gradle)
        # Publish the FULL build log (errors OR success marker) into a PUBLIC release
        # BODY. Runs LAST so both the native .so log and the gradle logs already
        # exist on disk. The release body is readable via the public GET /releases
        # API without repo-admin rights (raw job logs and release ASSETS both require
        # admin).
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="${{ github.workspace }}/easytier_build.log"
          [ -f "$LOG" ] || LOG="easytier_build.log"
          {
            if [ -f "$LOG" ] && grep -q "cargo build exit code: 0" "$LOG"; then
              echo "BUILD OK (native .so built)"
              grep -E "cargo build exit code|libeasytier_android.so|NDK_PATH|TOOLCHAIN" "$LOG" | tail -20
            else
              echo "=== NATIVE BUILD FAILED ==="
              if [ -f "$LOG" ]; then
                grep -Ei "error|panic|undefined reference|linker command|exit code|failed|cannot|not found|signal|killed" "$LOG" | tail -90 > /tmp/err.txt
                [ -s /tmp/err.txt ] || tail -120 "$LOG" > /tmp/err.txt
                cat /tmp/err.txt
              else
                echo "NATIVE LOG MISSING"; echo "PWD=$(pwd)"; ls -la "${{ github.workspace }}" | head -20
              fi
            fi
            for g in /tmp/gradle_server.log /tmp/gradle_app.log; do
              if [ -f "$g" ]; then
                echo "=== ${g} (error context) ==="
                grep -Ei "what went wrong|> Task .* FAILED|BUILD FAILED|error:|exception|failed|symbol:|location:|\^" "$g" | tail -80 > /tmp/gerr.txt
                if [ ! -s /tmp/gerr.txt ]; then
                  if grep -q "BUILD SUCCESSFUL" "$g"; then echo "(gradle BUILD SUCCESSFUL)"; else tail -40 "$g"; fi > /tmp/gerr.txt
                fi
                cat /tmp/gerr.txt
              fi
            done
          } > /tmp/body.txt
          BODY=$(cat /tmp/body.txt)
          # Cap body size to avoid GitHub 422 (body too large).
          if [ "${#BODY}" -gt 60000 ]; then BODY=$(printf '%s\n...\n[truncated]\n%s' "$(echo "$BODY" | head -c 30000)" "$(echo "$BODY" | tail -c 30000)"); fi
          RESP=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "ci-log-${{ github.run_id }}" --arg body "$BODY" '{tag_name:$tag,name:$tag,prerelease:true,body:$body}')" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          echo "published build log to release ci-log-${{ github.run_id }}"
          # Upload the built APK (if present) as a release asset so it is directly
          # downloadable from the Releases page without repo-admin rights.
          UPLOAD_URL=$(echo "$RESP" | jq -r '.upload_url // empty' | sed 's/{.*//')
          APK=""
          for p in "${{ github.workspace }}/Scrcpy/app/build/outputs/apk/debug/app-debug.apk" \
                   "${{ github.workspace }}/Scrcpy/app/build/outputs/apk/release/app-release.apk" \
                   "${{ github.workspace }}/release/Scrcpy.apk"; do
            [ -f "$p" ] && APK="$p" && break
          done
          if [ -n "$UPLOAD_URL" ] && [ -n "$APK" ]; then
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK" \
              "$UPLOAD_URL?name=$(basename "$APK")"
            echo "uploaded APK asset: $(basename "$APK")"
          else
            echo "no APK asset uploaded (UPLOAD_URL=${UPLOAD_URL:-EMPTY} APK=${APK:-NONE})"
          fi

      - name: Rename APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release
          APK_PATH=$(find Scrcpy/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" release/Scrcpy.apk
          ls -l release

      - name: Generate Tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Scrcpy Release ${{ steps.tag.outputs.release_tag }}
          body: |
            Version Name: ${{ inputs.app_version_name }}
            Version Code: ${{ steps.version.outputs.new_version_code }}
            Build Date: ${{ steps.tag.outputs.release_date }}
            Note: ${{ inputs.note }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release/Scrcpy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
