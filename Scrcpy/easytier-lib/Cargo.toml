[package]
name = "easytier-android-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "easytier_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1"
uuid = { version = "1", features = ["serde"] }
log = "0.4"
android_logger = "0.13"

# Dependencies verified against EasyTier `main` (2026-08). The `management-rpc`
# feature on `easytier` transitively enables `easytier-core/management-rpc` and
# exposes `native_instance_manager_with_runtime` / `NativeInstanceManager`.
# Consider pinning `rev = "<commit>"` for reproducible CI builds.
easytier = { git = "https://github.com/EasyTier/EasyTier", default-features = false, features = ["management-rpc"] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier", package = "easytier-core", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
